name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('pack.mcmeta'))"
          find data -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool > /dev/null

      - name: Build zip
        run: |
          mkdir -p dist
          zip -qr "dist/hanafubuki-tweaks-${{ steps.v.outputs.version }}.zip" pack.mcmeta data

      - uses: actions/upload-artifact@v4
        with:
          name: hanafubuki-tweaks-${{ steps.v.outputs.version }}
          path: dist/*.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip
